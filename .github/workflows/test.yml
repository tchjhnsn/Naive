name: test

on:
  # `branches` is the pull request base. A pull request into main still runs these jobs, and so does a push to main.
  pull_request:
    # A PR retargeted onto main needs a push, or a close and reopen, before its suite runs.
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: npm ci
      - run: node test.mjs

