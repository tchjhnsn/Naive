# plugin_marketplaces must be an https Git URL ending in .git (base-action/src/install-plugins.ts). A commit pin does not fit that input.
name: Claude Code

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      github.actor == 'tchjhnsn' &&
      (
        (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER') ||
        (github.event_name == 'issue_comment' && github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'OWNER')
      ) && (
        (github.event_name == 'issues' && (contains(github.event.issue.body || '', '@claude') || contains(github.event.issue.title || '', '@claude'))) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body || '', '@claude'))
      )
    runs-on: ubuntu-latest
    # setupGitHubToken in anthropics/claude-code-action@v1 calls core.getIDToken unless github_token is set.
    # This job does not set github_token, so id-token: write is required for that OIDC exchange.
    # claude_code_oauth_token authenticates Claude and does not skip the exchange.
    # actions: read is for reading CI logs. Opening a pull request does not need it, so it is omitted.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/cursor/plugins.git"
          plugins: "pstack@cursor-plugins"
