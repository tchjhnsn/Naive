name: lean
on:
  # `branches` is the pull request base. Paths still apply: both filters have to match.
  pull_request:
    # A PR retargeted onto main needs a push, or a close and reopen, before its suite runs.
    branches: [main]
    paths: ["lean/**", ".github/workflows/lean.yml"]
  push:
    branches: [main]
    paths: ["lean/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the proofs
        working-directory: lean
        run: |
          lake update
          lake exe cache get
          lake build
