# The PR review agent's privileged half. workflow_run always runs this file from the default branch, never from the PR.
# It checks out nothing and runs no PR code: it reads the `pr-review` artifact's members straight from the zip as text
# (nothing is extracted, so a symlink in the zip cannot pull in a local file), checks that the PR it names
# still has the reviewed head, and posts or updates one comment. It never merges, approves or pushes.
name: pr-review-comment

on:
  workflow_run:
    workflows: [pr-review]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    # `preview` never runs on pull_request, so an artifact from such a run can only be forged.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: run.id });
            const artifact = artifacts.find((a) => a.name === "pr-review");
            if (!artifact) { core.notice("No pr-review artifact (no preview review in this run)."); return; }
            const { data: zip } = await github.rest.actions.downloadArtifact({ ...context.repo, artifact_id: artifact.id, archive_format: "zip" });
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            fs.writeFileSync("pr-review.zip", Buffer.from(zip));
            const read = (f, max) => { const t = execFileSync("unzip", ["-p", "pr-review.zip", f], { encoding: "utf8", maxBuffer: 1 << 20 }); return t.length > max ? t.slice(0, max) + "\n\n(truncated)" : t; };

            const meta = JSON.parse(read("pr.json", 2000));
            const issue_number = Number(meta.pr);
            if (!Number.isInteger(issue_number) || issue_number <= 0) throw new Error("pr.json has no valid PR number");
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: issue_number });
            if (pr.head.sha !== run.head_sha) {
              core.notice(`PR #${issue_number} head ${pr.head.sha} is not the reviewed ${run.head_sha}; not commenting.`);
              return;
            }

            const marker = "<!-- naive-pr-review -->";
            const preview = /^https:\/\/[^\s)]+$/.test(meta.preview ?? "") ? meta.preview : "(not a valid https URL)";
            const body = [marker, "## PR review", "", `Preview: ${preview}`, `Run and screenshots: ${run.html_url}`, "",
              read("content.md", 30000), "", read("design.md", 30000), "",
              "_Findings only. This agent does not approve or block the PR._"].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const mine = comments.find((c) => c.user?.type === "Bot" && c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number, body });
