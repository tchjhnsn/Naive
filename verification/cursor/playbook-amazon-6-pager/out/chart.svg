<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 653 1515" width="653" height="1515" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state"><style>.pele {
  --pele-bg: #ffffff;
  --pele-fg: #1c1c1c;
  --pele-muted: #656565;
  --pele-line: #808080;
  --pele-surface: #fcfcfc;
  --pele-surface-alt: #f1f1f1;
  --pele-border: #c9c9c9;
}
.pele .blue rect { fill: #c3e0ff; }
.pele .orange rect { fill: #f0d3bf; }
.pele .purple rect { fill: #e3d5ff; }
.pele .yellow rect { fill: #f0dcbf; }
.pele .teal rect { fill: #bfe3df; }
.pele .tan rect { fill: #e5d9ce; }
.pele .pink rect { fill: #ffcbe6; }
.pele .breaks rect {
  fill: #ffecee !important;
  stroke: #e72e3b !important;
  stroke-width: 2.5px !important;
}
.pele .breaks text {
  fill: #cd2834 !important;
}
.pele .mayBreak rect {
  fill: #fff3e6 !important;
  stroke: #e8730c !important;
  stroke-width: 2.5px !important;
}
.pele .mayBreak text {
  fill: #b85a06 !important;
}
.pele .bugPath rect {
  stroke: #1680f3 !important;
  stroke-width: 2.5px !important;
}
.pele .repeats rect {
  stroke: #9b35d6 !important;
  stroke-width: 2.5px !important;
  stroke-dasharray: 6 3;
}
@media (prefers-color-scheme: dark) {
  .pele {
    --pele-bg: #1f1f1f;
    --pele-fg: #f5f5f5;
    --pele-muted: #acacac;
    --pele-line: #939393;
    --pele-surface: #121212;
    --pele-surface-alt: #2c2c2c;
    --pele-border: #4e4e4e;
  }
  .pele .blue rect { fill: #1b3857; }
  .pele .orange rect { fill: #573117; }
  .pele .purple rect { fill: #3c2e57; }
  .pele .yellow rect { fill: #573d17; }
  .pele .teal rect { fill: #174641; }
  .pele .tan rect { fill: #3d3127; }
  .pele .pink rect { fill: #57233e; }
  .pele .breaks rect {
    fill: #2e2021 !important;
    stroke: #cf2b35 !important;
  }
  .pele .breaks text {
    fill: #ff6463 !important;
  }
  .pele .mayBreak rect {
    fill: #2e2619 !important;
    stroke: #d0700f !important;
  }
  .pele .mayBreak text {
    fill: #ffa257 !important;
  }
  .pele .bugPath rect {
    stroke: #116dd2 !important;
  }
  .pele .repeats rect {
    stroke: #9a3fcf !important;
  }
}
</style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="326.5" y="25.6">A decision memo: draft, propose while it stays open, then you decide</tspan></text><g transform="translate(0,36)"><g class="pele-clusters"><g class="pele-cluster pele-state-composite" data-id="legend"><rect x="169.72" y="8" width="474.77" height="112" rx="10" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)"/><path d="M169.72,44H644.49" fill="none" stroke="var(--_b)"/><text class="pele-cluster-label" x="407.1" y="31.6" text-anchor="middle">Legend</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M122.72,120L122.72,157"/><path class="pele-marker" d="M122.72,164L119.36,156L126.08,156Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M122.72,208L122.72,285"/><path class="pele-marker" d="M122.72,292L119.36,284L126.08,284Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M122.72,396L122.72,473"/><path class="pele-marker" d="M122.72,480L119.36,472L126.08,472Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M122.72,542L122.72,619"/><path class="pele-marker" d="M122.72,626L119.36,618L126.08,618Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M122.72,688L122.72,750"/><path class="pele-marker" d="M122.72,757L119.36,749L126.08,749Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M122.72,840L122.72,902"/><path class="pele-marker" d="M122.72,909L119.36,901L126.08,901Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M122.72,971L122.72,1048"/><path class="pele-marker" d="M122.72,1055L119.36,1047L126.08,1047Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M122.72,1099L122.72,1161"/><path class="pele-marker" d="M122.72,1168L119.36,1160L126.08,1160Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M122.72,1230L122.72,1307"/><path class="pele-marker" d="M122.72,1314L119.36,1306L126.08,1306Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M122.72,1358L122.72,1420"/><path class="pele-marker" d="M122.72,1427L119.36,1419L126.08,1419Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge1"><rect x="37.79" y="228.5" width="169.87" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="122.72" y="242.4">you read what the venture</tspan><tspan x="122.72" y="260.4">already holds</tspan></text></g><g class="pele-edge-label" data-id="edge2"><rect x="20.28" y="416.5" width="204.88" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="122.72" y="430.4">you draft a memo and leave the</tspan><tspan x="122.72" y="448.4">sections empty</tspan></text></g><g class="pele-edge-label" data-id="edge3"><rect x="24.17" y="562.5" width="197.1" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="122.72" y="576.4">you open the memo you mean</tspan><tspan x="122.72" y="594.4">to propose</tspan></text></g><g class="pele-edge-label" data-id="edge4"><rect x="19.13" y="708.5" width="207.18" height="21" rx="3" fill="var(--_bg)"/><text x="122.72" y="723.9" text-anchor="middle">you write the customer narrative</text></g><g class="pele-edge-label" data-id="edge5"><rect x="57.25" y="860.5" width="130.95" height="21" rx="3" fill="var(--_bg)"/><text x="122.72" y="875.9" text-anchor="middle">you record a finding</text></g><g class="pele-edge-label" data-id="edge6"><rect x="27.66" y="991.5" width="190.11" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="122.72" y="1005.4">you add the FAQ and cite the</tspan><tspan x="122.72" y="1023.4">finding</tspan></text></g><g class="pele-edge-label" data-id="edge7"><rect x="35.08" y="1119.5" width="175.29" height="21" rx="3" fill="var(--_bg)"/><text x="122.72" y="1134.9" text-anchor="middle">you run the decision matrix</text></g><g class="pele-edge-label" data-id="edge8"><rect x="26.12" y="1250.5" width="193.21" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="122.72" y="1264.4">you propose the memo, and it</tspan><tspan x="122.72" y="1282.4">stays open</tspan></text></g><g class="pele-edge-label" data-id="edge9"><rect x="84.87" y="1378.5" width="75.7" height="21" rx="3" fill="var(--_bg)"/><text x="122.72" y="1393.9" text-anchor="middle">you decide</text></g></g><g class="pele-nodes"><g class="pele-node pele-state tan" data-id="s0" transform="translate(122.72,186)"><rect x="-63.57" y="-22" width="127.14" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">No memo yet</text></g><g class="pele-node pele-state tan" data-id="s1" transform="translate(122.72,344)"><rect x="-114.72" y="-52" width="229.44" height="104" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">You have read the problem,</tspan><tspan x="0" y="-4.9">the customer, the</tspan><tspan x="0" y="16.1">principles, and who may</tspan><tspan x="0" y="37.1">decide</tspan></text></g><g class="pele-node pele-state blue" data-id="s2" transform="translate(122.72,511)"><rect x="-110.26" y="-31" width="220.51" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">An incomplete memo is an</tspan><tspan x="0" y="16.1">open draft</tspan></text></g><g class="pele-node pele-state blue" data-id="s3" transform="translate(122.72,657)"><rect x="-100.48" y="-31" width="200.96" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">The memo you mean to</tspan><tspan x="0" y="16.1">finish is an open draft</tspan></text></g><g class="pele-node pele-state blue" data-id="s4" transform="translate(122.72,798.5)"><rect x="-113.38" y="-41.5" width="226.75" height="83" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">The draft names the</tspan><tspan x="0" y="5.6">customer, the problem, and</tspan><tspan x="0" y="26.6">a solution</tspan></text></g><g class="pele-node pele-state blue" data-id="s5" transform="translate(122.72,940)"><rect x="-113.82" y="-31" width="227.65" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">A finding is recorded for the</tspan><tspan x="0" y="16.1">FAQ</tspan></text></g><g class="pele-node pele-state blue" data-id="s6" transform="translate(122.72,1077)"><rect x="-108.49" y="-22" width="216.98" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">The FAQ cites that finding</text></g><g class="pele-node pele-state blue" data-id="s7" transform="translate(122.72,1199)"><rect x="-107.15" y="-31" width="214.3" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">The decision matrix still</tspan><tspan x="0" y="16.1">shows the memo as open</tspan></text></g><g class="pele-node pele-state yellow" data-id="s8" transform="translate(122.72,1336)"><rect x="-101.82" y="-22" width="203.65" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Proposed, and still open</text></g><g class="pele-node pele-state teal" data-id="s9" transform="translate(122.72,1449)"><rect x="-71.14" y="-22" width="142.27" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Decided by you</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(122.72,113)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state tan" data-id="lg0" transform="translate(221.73,82)"><rect x="-36.01" y="-22" width="72.02" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">ready</text></g><g class="pele-node pele-state blue" data-id="lg1" transform="translate(329.74,82)"><rect x="-32.01" y="-22" width="64.02" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">draft</text></g><g class="pele-node pele-state yellow" data-id="lg2" transform="translate(451.1,82)"><rect x="-49.35" y="-22" width="98.7" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">proposed</text></g><g class="pele-node pele-state teal" data-id="lg3" transform="translate(584.47,82)"><rect x="-44.02" y="-22" width="88.03" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">decided</text></g></g></g></svg>